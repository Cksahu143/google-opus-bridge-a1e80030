# steel-login is called straight from the browser and does its own
# JWT verification (requireUser) inside the handler. Platform-level JWT
# verification has to be off so CORS preflight (OPTIONS, no Authorization
# header) isn't rejected before the function ever runs.
[functions.steel-login]
verify_jwt = false

# The proxy also verifies the Supabase JWT itself so it can handle CORS
# preflight before authentication and keep the upstream service token private.
[functions.notebooklm-proxy]
verify_jwt = false
